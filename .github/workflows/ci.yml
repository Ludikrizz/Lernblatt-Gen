name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Sucht API-Schlüssel, Tokens und Passwörter in allen Commits des PR oder Pushs.
  # Ein Fehlalarm wird in .gitleaksignore mit seinem Fingerprint eingetragen.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR-Kommentare brauchen Schreibrechte, der Job hat nur Leserechte.
          GITLEAKS_ENABLE_COMMENTS: false

  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 1. Kein Kursmaterial und keine generierten Daten im Repo (Urheberrecht).
      - name: Repo-Hygiene
        run: |
          bad=$(git ls-files | grep -E '^(data|scratch)/' \
                | grep -vE '^data/README\.md$|^scratch/\.gitkeep$' || true)
          pdfs=$(git ls-files '*.pdf' '*.PDF' | grep -v '^tools/' || true)
          if [ -n "$bad$pdfs" ]; then
            echo "::error::Kursmaterial oder generierte Dateien im Commit:"
            printf '%s\n' $bad $pdfs
            exit 1
          fi

      # 2. Keine festen Pfade auf einen einzelnen Rechner.
      - name: Keine lokalen Projektpfade
        run: |
          if git ls-files 'src/*' 'scripts/*' 'tests/*' '.claude/*' '.pi/*' \
                          'AGENTS.md' 'docs/*' 'data/*' \
             | xargs grep -nE '[A-Za-z]:/Studium|[A-Za-z]:\\Studium'; then
            echo "::error::Fester Projektpfad gefunden. lernblatt.paths oder relative Pfade nutzen."
            exit 1
          fi

      # 3. .pi/agents/ spiegelt .claude/agents/. Die Skills liest Pi direkt aus
      #    .claude/skills/ (siehe .pi/settings.json).
      - name: Spiegelung der Agenten
        run: |
          for f in .claude/agents/*.md; do
            diff -q "$f" ".pi/agents/$(basename "$f")"
          done
          for f in .pi/agents/*.md; do
            diff -q "$f" ".claude/agents/$(basename "$f")"
          done

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Abhängigkeiten installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
          uv sync --locked

      # 4. Lint und Format (Regeln in pyproject.toml).
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # 5. Selbsttests und CLI-Tests (laufen ohne Kursmaterial), siehe tests/.
      - name: Tests
        run: uv run pytest -v

      - name: CLI
        run: uv run lernblatt selftest
