[project]
name = "lernblatt-gen"
version = "0.1.0"
description = "GenAI-Pipeline: quellengebundene Lernblätter aus Vorlesungsfolien, Übungen und Klausuren"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Text-Erstpass und Folientitel (Rust-Parser, https://github.com/firecrawl/pdf-inspector)
    "pdf-inspector==1.26.1",
    # PDF-Markierungen, Geometrie, Crops, Rendering
    "pymupdf==2.1",
    # OCR-Fallback für Scans und Grafikseiten (ruft Tesseract oder RapidOCR auf)
    "pymupdf4llm==2.1",
    "rapidocr==3.10.0",
    "onnxruntime==1.32.0",
    # Selbsttest des OCR-Fallbacks
    "pillow==13.0.0",
]

[project.scripts]
lernblatt = "lernblatt.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lernblatt"

[dependency-groups]
dev = ["ruff==0.17.6", "pytest==9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
# Editor nutzt die uv-Umgebung statt des globalen Python.
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["tools", "data", "scratch"]

[tool.ruff.lint]
# E9: Syntaxfehler, F: Pyflakes (undefinierte Namen, ungenutzte Importe),
# I: Import-Reihenfolge, B: typische Fehlerquellen (bugbear).
select = ["E9", "F", "I", "B"]
ignore = [
    "B905",  # zip() ohne strict= ist in den Skripten beabsichtigt
]
